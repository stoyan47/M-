<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Специален въпрос ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Comfortaa', cursive;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90%;
            transition: all 0.3s ease;
        }

        h1 { color: #d63384; font-size: 2rem; margin-bottom: 30px; }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            font-family: 'Comfortaa', cursive;
        }

        #yesBtn { background-color: #ff4d6d; color: white; z-index: 100; }
        #noBtn { background-color: #888; color: white; }

        /* Прозорецът-сърце с центриран текст */
        #loveWindow {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background-color: #ff4d6d;
            clip-path: url(#heart-shape);
            
            /* Центриране на текста вътре */
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 40px; /* Леко отместване нагоре, за да изглежда визуално центрирано в "корема" на сърцето */
            box-sizing: border-box;
            
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            z-index: 1000;
            animation: beat 0.8s infinite alternate, fadeIn 0.5s;
        }

        @keyframes beat {
            to { transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        .heart-bg {
            position: absolute;
            color: #ff4d6d;
            animation: float 5s linear infinite;
            opacity: 0.5;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <clipPath id="heart-shape" clipPathUnits="objectBoundingBox">
                <path d="M0.5,0.9 C0.3,0.7 0,0.45 0,0.3 C0,0.1 0.15,0 0.3,0 C0.4,0 0.45,0.05 0.5,0.1 C0.55,0.05 0.6,0 0.7,0 C0.85,0 1,0.1 1,0.3 C1,0.45 0.7,0.7 0.5,0.9 Z"/>
            </clipPath>
        </defs>
    </svg>

    <div class="container" id="mainBox">
        <h1>Ще бъдеш ли моята Валентинка? ❤️</h1>
        <div class="buttons">
            <button class="btn" id="yesBtn" onclick="showLove()">ДА</button>
            <button class="btn" id="noBtn" onclick="growYes()">НЕ</button>
        </div>
    </div>

    <div id="loveWindow">ОБИЧАМ ТЕ!</div>

    <script>
        let yesSize = 1.2;
        let paddingVar = 15;

        function growYes() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            
            yesSize += 0.5;
            paddingVar += 10;
            
            yesBtn.style.fontSize = yesSize + "rem";
            yesBtn.style.padding = paddingVar + "px " + (paddingVar * 2) + "px";

            if (yesSize > 5) {
                noBtn.style.display = "none";
                yesBtn.style.width = "100vw";
                yesBtn.style.height = "100vh";
                yesBtn.style.position = "fixed";
                yesBtn.style.top = "0";
                yesBtn.style.left = "0";
                yesBtn.style.borderRadius = "0";
                yesBtn.innerHTML = "ДА"; 
            }
        }

        function showLove() {
            document.getElementById('mainBox').style.display = 'none';
            const loveWin = document.getElementById('loveWindow');
            loveWin.style.display = 'flex';
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
