<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Специален въпрос ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90%;
            transition: all 0.3s ease;
        }

        h1 { color: #d63384; font-size: 2rem; margin-bottom: 30px; }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Стилизиране на бутоните */
        .btn {
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 100;
        }

        #noBtn {
            background-color: #888;
            color: white;
        }

        /* Прозорецът-сърце */
        #loveWindow {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background-color: #ff4d6d;
            clip-path: path('M150 280 c-50 -50 -150 -130 -150 -200 c0 -50 40 -90 90 -90 c30 0 55 15 70 40 c15 -25 40 -40 70 -40 c50 0 90 40 90 90 c0 70 -100 150 -150 200 z');
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            z-index: 1000;
            animation: beat 0.8s infinite alternate, fadeIn 0.5s;
        }

        @keyframes beat {
            to { transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* Летящи сърца от предишния код */
        .heart-bg {
            position: absolute;
            color: #ff4d6d;
            animation: float 5s linear infinite;
            opacity: 0.5;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainBox">
        <h1>Ще бъдеш ли моята Валентинка? ❤️</h1>
        <div class="buttons">
            <button class="btn" id="yesBtn" onclick="showLove()">ДА</button>
            <button class="btn" id="noBtn" onclick="growYes()">НЕ</button>
        </div>
    </div>

    <div id="loveWindow">ОБИЧАМ ТЕ!</div>

    <script>
        let yesSize = 1.2;
        let paddingVar = 15;

        function growYes() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            
            // Увеличаваме размера на шрифта и отстъпите
            yesSize += 0.5;
            paddingVar += 10;
            
            yesBtn.style.fontSize = yesSize + "rem";
            yesBtn.style.padding = paddingVar + "px " + (paddingVar * 2) + "px";

            // Ако стане прекалено голям, скриваме бутона НЕ
            if (yesSize > 5) {
                noBtn.style.display = "none";
                yesBtn.style.width = "100vw";
                yesBtn.style.height = "100vh";
                yesBtn.style.position = "fixed";
                yesBtn.style.top = "0";
                yesBtn.style.left = "0";
                yesBtn.style.borderRadius = "0";
                yesBtn.innerHTML = "КЛИКНИ ТУК (ДА!)";
            }
        }

        function showLove() {
            document.getElementById('mainBox').style.display = 'none';
            const loveWin = document.getElementById('loveWindow');
            loveWin.style.display = 'flex';
            
            // Спираме създаването на малки сърца и пускаме фойерверки от сърца? 
            // Шега, просто оставяме голямото сърце да бие.
        }

        // Летящи сърца за фон
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
