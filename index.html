<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>За теб ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Comfortaa', cursive;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        h1 { color: #d63384; font-size: 1.8rem; margin-bottom: 30px; }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            font-family: 'Comfortaa', cursive;
        }

        #yesBtn { background-color: #ff4d6d; color: white; z-index: 100; }
        #noBtn { background-color: #888; color: white; }

        /* ПЕРФЕКТНО ЦЕНТРИРАНО СЪРЦЕ И ТЕКСТ */
        #loveWindow {
            display: none; /* Ще се промени на 'grid' чрез JS */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            max-width: 350px;
            max-height: 350px;
            background-color: #ff4d6d;
            clip-path: url(#heart-shape);
            
            /* Използваме Grid за перфектно центриране на текста */
            place-items: center; 
            align-content: center;
            
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            z-index: 1000;
            animation: beat 0.8s infinite alternate;
        }

        @keyframes beat {
            to { transform: translate(-50%, -50%) scale(1.08); }
        }

        .heart-bg {
            position: absolute;
            color: #ff4d6d;
            animation: float 5s linear infinite;
            opacity: 0.5;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(110vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <clipPath id="heart-shape" clipPathUnits="objectBoundingBox">
                <path d="M0.5,0.9 C0.3,0.7 0,0.45 0,0.3 C0,0.1 0.15,0 0.3,0 C0.4,0 0.45,0.05 0.5,0.1 C0.55,0.05 0.6,0 0.7,0 C0.85,0 1,0.1 1,0.3 C1,0.45 0.7,0.7 0.5,0.9 Z"/>
            </clipPath>
        </defs>
    </svg>

    <div class="container" id="mainBox">
        <h1>Ще бъдеш ли моята Валентинка? ❤️</h1>
        <div class="buttons">
            <button class="btn" id="yesBtn" onclick="showLove()">ДА</button>
            <button class="btn" id="noBtn" onclick="growYes()">НЕ</button>
        </div>
    </div>

    <div id="loveWindow">ОБИЧАМ ТЕ!</div>

    <script>
        let yesSize = 1.1;
        let paddingVar = 15;

        function growYes() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            yesSize += 0.4;
            paddingVar += 8;
            yesBtn.style.fontSize = yesSize + "rem";
            yesBtn.style.padding = paddingVar + "px " + (paddingVar * 1.5) + "px";

            if (yesSize > 4) {
                noBtn.style.display = "none";
                yesBtn.style.width = "100vw";
                yesBtn.style.height = "100vh";
                yesBtn.style.position = "fixed";
                yesBtn.style.top = "0";
                yesBtn.style.left = "0";
                yesBtn.style.borderRadius = "0";
                yesBtn.style.display = "flex";
                yesBtn.style.justifyContent = "center";
                yesBtn.style.alignItems = "center";
                yesBtn.innerHTML = "ДА";
            }
        }

        function showLove() {
            document.getElementById('mainBox').style.display = 'none';
            const loveWin = document.getElementById('loveWindow');
            loveWin.style.display = 'grid'; // Променено на grid за центриране
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
